name: Build Play Store Release (Signed AAB)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version Code (integer — must increase on every Play Store upload)'
        required: true
        default: '1'
  push:
    tags:
      - 'v*'

jobs:
  build-playstore-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (for Capacitor & Android tooling)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Version Metadata
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
          else
            TAG_NAME="${GITHUB_REF_NAME#v}"
            echo "name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Type-Check & Build Production Web Assets
        env:
          VITE_ADMOB_ANDROID_APP_ID: ${{ secrets.VITE_ADMOB_ANDROID_APP_ID }}
          VITE_ADMOB_INTERSTITIAL_ID: ${{ secrets.VITE_ADMOB_INTERSTITIAL_ID }}
          VITE_ADMOB_REWARDED_ID: ${{ secrets.VITE_ADMOB_REWARDED_ID }}
          VITE_ADMOB_TESTING: 'false'
        run: |
          bun run lint
          bun run build

      - name: Sync Web Assets into Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi
          bunx cap sync android

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Inject google-services.json (Optional Firebase Native Config)
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Decode Release Keystore from GitHub Secrets
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release signing configured securely from GitHub Secrets."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not set yet. Building an UNSIGNED AAB for CI validation only (configure ANDROID_KEYSTORE_* secrets before uploading to Google Play)."
          fi

      - name: Build Android App Bundle (.aab)
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && 'app/release-keystore.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }} \
            --no-daemon --stacktrace
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Verify AAB Signature (When Signing Enabled)
        if: ${{ steps.signing.outputs.signed == 'true' }}
        run: |
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab > /dev/null
          echo "AAB cryptographic signature verified successfully."

      - name: Clean Up Temporary Secrets on Runner
        if: always()
        run: rm -f android/app/release-keystore.jks android/app/google-services.json

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: midan-almarifa-playstore-v${{ steps.version.outputs.name }}-code${{ steps.version.outputs.code }}-${{ steps.signing.outputs.signed == 'true' && 'signed' || 'unsigned' }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
